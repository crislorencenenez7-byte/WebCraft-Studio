<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Start a Project — WebCraft Studio</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header class="topbar">
  <a class="logo" href="../index.html">
    <span>W</span> WebCraft Studio
  </a>

  <nav>
    <a href="../index.html">Home</a>
    <a class="nav-btn" href="project.html">My project</a>
  </nav>
</header>

<main class="form-page">

  <section class="form-intro">
    <div class="pill">NEW PROJECT</div>

    <h1>
      Show us what<br>
      <em>you have in mind.</em>
    </h1>

    <p>
      Choose a package, upload your design and tell us what you want us to build.
    </p>
  </section>

  <section class="panel">

    <form id="requestForm">

      <label>
        Name
        <input
          name="name"
          id="clientName"
          placeholder="Your name"
          required
        >
      </label>

      <label>
        Email
        <input
          name="email"
          id="clientEmail"
          type="email"
          placeholder="you@example.com"
          readonly
          required
        >
      </label>

      <label>
        Project name
        <input
          name="website"
          id="projectName"
          placeholder="e.g. My Business Website"
          required
        >
      </label>

      <label>
        Choose a package
      </label>

      <div class="package-grid">

        <label class="package-card">
          <input
            type="radio"
            name="package"
            value="HTML ONLY"
            data-price="100"
          >

          <span>
            <strong>HTML ONLY</strong>
            <b>₱100</b>
            <small>Basic HTML website</small>
          </span>
        </label>

        <label class="package-card">
          <input
            type="radio"
            name="package"
            value="HTML + CSS"
            data-price="150"
          >

          <span>
            <strong>HTML + CSS</strong>
            <b>₱150</b>
            <small>HTML website with styling</small>
          </span>
        </label>

        <label class="package-card">
          <input
            type="radio"
            name="package"
            value="HTML + CSS + JAVASCRIPT"
            data-price="200"
          >

          <span>
            <strong>HTML + CSS + JAVASCRIPT</strong>
            <b>₱200</b>
            <small>Website with styling and JavaScript</small>
          </span>
        </label>

      </div>

      <label>
        What should we build?
        <textarea
          name="requirements"
          id="requirements"
          rows="6"
          placeholder="Pages, colors, buttons, animations, mobile behavior, etc."
        ></textarea>
      </label>

      <label class="upload">
        Design screenshot(s)

        <input
          name="designs"
          id="designs"
          type="file"
          accept="image/png,image/jpeg,image/webp"
          multiple
          required
        >

        <span>
          Choose up to 5 images. Images are automatically compressed.
        </span>
      </label>

      <div id="selectedImages" class="muted"></div>

      <div id="selectedPrice" class="notice hidden"></div>

      <button class="btn" type="submit">
        Continue to Payment →
      </button>

    </form>

    <div id="message" class="notice hidden"></div>

  </section>

</main>

<script type="module" src="../js/request.js"></script>

</body>
</html>
