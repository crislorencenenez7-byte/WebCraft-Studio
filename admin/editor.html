<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Code Editor — WebCraft Studio</title><link rel="stylesheet" href="../css/style.css"><style>.editor-layout{display:grid;grid-template-columns:280px 1fr;gap:18px}.tree-panel{max-height:70vh;overflow:auto}.tree-item{display:block;width:100%;text-align:left;background:transparent;color:inherit;border:0;padding:9px 10px;border-radius:8px;cursor:pointer}.tree-item:hover,.tree-item.active{background:rgba(255,215,0,.1)}.tree-folder{font-weight:700}.tree-child{padding-left:28px}.tree-grand{padding-left:48px}.file-desc{font-size:13px;line-height:1.5;padding:12px;border-radius:10px;background:rgba(255,255,255,.04);margin-bottom:10px}.designs{display:flex;gap:10px;overflow:auto}.designs img{width:180px;height:120px;object-fit:cover;border-radius:10px}.payment-actions{display:flex;gap:10px;flex-wrap:wrap}.code-area{min-height:55vh;width:100%;box-sizing:border-box}.editor-top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}@media(max-width:800px){.editor-layout{grid-template-columns:1fr}.tree-panel{max-height:35vh}}</style></head><body><header class="topbar"><a class="logo" href="../index.html"><span>W</span> WebCraft Studio <small>ADMIN</small></a><nav><a href="dashboard.html">Dashboard</a></nav></header><main class="page"><section class="panel"><div class="editor-top"><div><span>CODE WORKSPACE</span><h1 id="projectTitle">Project editor</h1><p id="projectMeta" class="muted"></p></div><button class="btn" id="deliver">Mark completed</button></div><div id="projectInfo"></div></section><section class="panel"><h2>Client Designs</h2><div id="designs" class="designs"><p class="muted">Loading...</p></div></section><section class="panel"><h2>Payment Transaction</h2><div id="paymentInfo"><p class="muted">Loading...</p></div><div id="paymentActions" class="payment-actions"></div></section><section class="panel"><h2>Requested File Structure</h2><div class="editor-layout"><aside class="tree-panel" id="fileTree"></aside><section><div id="fileDescription" class="file-desc">Select a file.</div><div class="editor-toolbar"><input id="fileName" value="index.html" readonly><button id="preview">Preview ↗</button><button id="saveCode">Save</button></div><textarea id="code" class="code-area" spellcheck="false" placeholder="Paste code here..."></textarea></section></div><div id="editorMessage" class="notice hidden"></div></section></main><script type="module" src="../js/editor.js"></script></body></html>
