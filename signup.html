<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign Up — WebCraft Studio</title><link rel="stylesheet" href="css/style.css"></head>
<body data-auth-page="guest"><header class="topbar"><a class="logo" href="index.html"><span>W</span> WebCraft Studio</a><nav><a href="index.html">Home</a><a class="nav-btn" href="login.html">Log in</a></nav></header>
<main class="form-page"><section class="form-intro"><div class="pill">CREATE ACCOUNT</div><h1>Start your<br><em>project.</em></h1><p>Create your client account first, then submit your website design and requirements.</p></section><section class="panel"><form id="signupForm"><label>Full name<input id="fullname" placeholder="Your full name" required></label><label>Email<input id="email" type="email" placeholder="you@example.com" required></label><label>Password<input id="password" type="password" minlength="6" placeholder="At least 6 characters" required></label><label>Confirm password<input id="confirm" type="password" minlength="6" placeholder="Repeat your password" required></label><button class="btn" type="submit">Create account →</button></form><div id="message" class="notice hidden"></div><p class="muted auth-switch">Already have an account? <a href="login.html">Log in</a></p></section></main><script type="module" src="js/auth.js"></script></body></html>
