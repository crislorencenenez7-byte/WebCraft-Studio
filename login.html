<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Login — WebCraft Studio</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body data-auth-page="guest">

<header class="topbar">

  <a class="logo" href="index.html">
    <span>W</span> WebCraft Studio
  </a>

  <nav>
    <a href="index.html">Home</a>
    <a class="nav-btn" href="signup.html">Sign up</a>
  </nav>

</header>


<main class="form-page">

  <section class="form-intro">

    <div class="pill">
      CLIENT PORTAL
    </div>

    <h1>
      Welcome<br>
      <em>back.</em>
    </h1>

    <p>
      Sign in to submit projects, track progress,
      and view completed websites.
    </p>

  </section>


  <section class="panel">

    <form id="loginForm">

      <label>
        Email

        <input
          id="email"
          name="email"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >
      </label>


      <label>
        Password

        <input
          id="password"
          name="password"
          type="password"
          placeholder="Your password"
          autocomplete="current-password"
          required
        >
      </label>


      <label class="check">

        <input
          id="remember"
          name="remember"
          type="checkbox"
          checked
        >

        Remember me

      </label>


      <button
        class="btn"
        type="submit"
      >
        Log in →
      </button>


      <button
        class="text-link"
        type="button"
        id="forgot"
      >
        Forgot password?
      </button>

    </form>


    <!-- Verification Section -->

    <div class="verification-box">

      <p>
        Didn't receive your verification email?
      </p>

      <button
        class="btn"
        type="button"
        onclick="resendVerificationEmail()"
      >
        Resend Verification Email
      </button>

    </div>


    <!-- Firebase Message -->

    <div
      id="message"
      class="notice hidden"
    ></div>


    <p class="muted auth-switch">

      Don't have an account?

      <a href="signup.html">
        Create one
      </a>

    </p>

  </section>

</main>


<footer>
  © 2026 WebCraft Studio
  <span>Design to code, made simple.</span>
</footer>


<!-- Firebase Authentication -->

<script
  type="module"
  src="js/auth.js"
></script>

</body>
</html>
